
<label for="warnaUtama">Warna motif</label>
<input type="color" id="warnaUtama" value="#ef5350">

<label for="warnaLatar">Warna latar belakang</label>
<input type="color" id="warnaLatar" value="#291821">

<label for="kerapatan">
  Kerapatan motif: <span id="kerapatanText">62%</span>
</label>
<input type="range" id="kerapatan" min="40" max="90" value="62">

<label for="ukuran">
  Ukuran motif: <span id="ukuranText">100%</span>
</label>
<input type="range" id="ukuran" min="50" max="150" value="100">

<button id="simpanPng" type="button">Simpan Motif sebagai PNG</button>
